<h2>Kuis Perawakan Pendek dan Stunting pada Anak</h2>
<div id="app"></div>
</div>
<script>
const Q=[
{t:"C1-C2",s:"Perawakan pendek (short stature) didefinisikan sebagai tinggi badan di bawah...",o:["P3 atau -2 SD kurva yang sesuai usia dan jenis kelamin","P50 pada semua usia","P97 pada usia sekolah","-3 SD pada semua usia","P25 pada bayi saja"],w:["P50 adalah median; tinggi badan di bawah median belum tentu perawakan pendek.","P97 adalah batas atas, bukan batas bawah perawakan pendek.","-3 SD adalah ambang yang terlalu rendah; perawakan pendek sudah didefinisikan pada -2 SD atau P3.","P25 terlalu tinggi sebagai batas, dan ambang ini tidak digunakan untuk bayi saja."],e:"Perawakan pendek didefinisikan sebagai tinggi badan di bawah P3 atau -2 SD kurva yang sesuai dengan usia dan jenis kelamin. Penilaian selalu dibandingkan dengan kurva referensi yang tepat, bukan dengan nilai tunggal untuk semua usia."},
{t:"C1-C2",s:"Stunting pada balita didefinisikan sebagai gagal tumbuh akibat kekurangan gizi kronis, dengan PB/U atau TB/U di bawah...",o:["-2 SD berdasarkan WHO Growth Standard 2006","-1 SD berdasarkan CDC 2000","-3 SD berdasarkan WHO Growth Standard 2006","P50 berdasarkan kurva lokal","P3 berdasarkan kurva CDC 2000"],w:["Batas -1 SD terlalu sensitif dan tidak digunakan sebagai definisi stunting dalam pedoman.","Kurva CDC 2000 bukan standar yang digunakan untuk menentukan stunting pada balita menurut pedoman Kemenkes dan WHO.","Batas -3 SD adalah definisi stunting berat, bukan batas definisi stunting secara umum.","P50 adalah median, bukan batas definisi stunting."],e:"Stunting adalah gangguan pertumbuhan linier pada balita yang ditandai PB/U atau TB/U di bawah -2 SD berdasarkan WHO Growth Standard 2006. Kondisi ini merupakan hasil malnutrisi kronis dan bersifat berbeda dari wasting, yaitu kekurangan berat badan akut."},
{t:"C1-C2",s:"Perbedaan utama antara perawakan pendek dan stunting adalah...",o:["Stunting merupakan gagal tumbuh akibat gizi kronis pada balita, sedangkan perawakan pendek mencakup berbagai penyebab dan usia","Stunting hanya terjadi pada remaja, sedangkan perawakan pendek hanya terjadi pada balita","Perawakan pendek selalu disebabkan defisiensi gizi, sedangkan stunting selalu genetik","Tidak ada perbedaan, keduanya istilah yang sama","Stunting ditentukan dengan BB/TB, perawakan pendek dengan lingkar kepala"],w:["Stunting tidak hanya terjadi pada remaja; istilah ini dipakai untuk balita, sedangkan perawakan pendek terjadi pada semua usia.","Perawakan pendek tidak selalu disebabkan defisiensi gizi dan dapat genetik, endokrin, atau kronik.","Stunting dapat ditentukan dengan PB/U atau TB/U, bukan BB/TB atau lingkar kepala.","Keduanya memiliki definisi dan cakupan berbeda, sehingga tidak dapat dianggap sama."],e:"Stunting adalah istilah untuk balita di bawah lima tahun yang mengalami gagal tumbuh akibat kekurangan gizi kronis. Perawakan pendek adalah istilah yang lebih luas, dapat terjadi pada semua usia, dan memiliki banyak penyebab, baik endokrin, genetik, maupun nonendokrin."},
{t:"C1-C2",s:"Kriteria awal diagnosis perawakan pendek adalah...",o:["TB di bawah P3, kecepatan tumbuh di bawah P25, dan perkiraan tinggi akhir di bawah tinggi potensi genetik","BB di bawah P3 saja","Lingkar kepala di bawah P3 dengan usia tulang lebih muda","Kecepatan tumbuh di atas P97 tanpa riwayat keluarga","TB normal dengan usia tulang lebih tua"],w:["Kriteria BB di bawah P3 saja tidak menilai pertumbuhan linier, yang menjadi inti perawakan pendek.","Lingkar kepala tidak termasuk kriteria awal perawakan pendek, dan usia tulang lebih muda tidak cukup sebagai definisi.","Kecepatan tumbuh di atas P97 mengarah ke pertumbuhan cepat, bukan perawakan pendek.","TB normal tidak memenuhi kriteria perawakan pendek; usia tulang yang lebih tua juga tidak sesuai."],e:"Kriteria awal meliputi TB di bawah P3, kecepatan tumbuh di bawah P25, dan perkiraan tinggi akhir di bawah tinggi potensi genetik (TPG). Ketiga kriteria ini dinilai bersama untuk membedakan variasi normal dari kondisi patologis."},
{t:"C1-C2",s:"Tinggi potensi genetik (TPG) dihitung berdasarkan...",o:["Rata-rata tinggi badan kedua orang tua (mid-parental height) dengan koreksi jenis kelamin, plus minus 8,5 cm","Tinggi badan saudara kandung saja","Berat badan lahir dan panjang badan lahir","Usia menarche ibu dan usia tulang anak","Lingkar kepala orang tua"],w:["Tinggi badan saudara kandung tidak digunakan dalam perhitungan TPG menurut pedoman.","Berat dan panjang lahir mencerminkan kondisi intrauterin, bukan potensi tinggi akhir.","Usia menarche ibu dan usia tulang anak bukan komponen rumus TPG.","Lingkar kepala orang tua tidak digunakan untuk memperkirakan tinggi akhir."],e:"TPG adalah perkiraan tinggi akhir anak berdasarkan tinggi kedua orang tua, dihitung dari rata-rata mid-parental height dengan koreksi jenis kelamin dan rentang sekitar plus minus 8,5 cm. Pada contoh PPT, rentang TPG 159,5-176,5 cm."},
{t:"C1-C2",s:"Nilai normal rasio segmen atas dan segmen bawah tubuh pada usia 8-10 tahun, dengan segmen bawah diukur dari simfisis pubis sampai telapak kaki, adalah...",o:["1","1,7","0,5","2,5","1,3"],w:["Nilai 1,7 adalah rasio segmen normal saat lahir, bukan pada usia 8-10 tahun.","Nilai 0,5 menunjukkan segmen bawah jauh lebih panjang dari segmen atas, tidak sesuai dengan rentang normal.","Nilai 2,5 menunjukkan segmen atas jauh lebih dominan, tidak sesuai dengan usia 8-10 tahun.","Nilai 1,3 tidak tercantum sebagai nilai normal pada usia 8-10 tahun dalam pedoman."],e:"Rasio segmen atas dan bawah normal (proporsional) adalah 1,7 saat lahir dan 1 pada usia 8-10 tahun. Segmen atas dihitung sebagai TB dikurangi segmen bawah. Rasio ini membantu menilai kelainan proporsi tubuh, seperti displasia tulang."},
{t:"C1-C2",s:"Ciri khas familial short stature adalah...",o:["Usia tulang sesuai usia kronologis, tinggi dewasa di bawah P3 sesuai potensi genetik, dan laboratorium normal","Usia tulang lebih muda dari usia kronologis dengan tinggi dewasa di atas P3","Perlambatan pertumbuhan linier pada tiga tahun pertama dengan catch-up saat pubertas","Kelainan endokrin yang terdeteksi pada pemeriksaan hormon","Usia tulang lebih tua dari usia kronologis"],w:["Usia tulang lebih muda dari kronologis dengan tinggi dewasa di atas P3 adalah ciri constitutional delay, bukan familial short stature.","Perlambatan pertumbuhan pada tiga tahun pertama dengan catch-up saat pubertas adalah ciri constitutional delay of growth and puberty.","Familial short stature tidak memiliki kelainan endokrin; jika ditemukan, diagnosis perlu dipikirkan ulang.","Usia tulang lebih tua dari kronologis tidak sesuai dengan familial short stature maupun constitutional delay."],e:"Familial short stature ditandai usia tulang sesuai kronologis, tinggi dewasa di bawah P3 tetapi sesuai TPG, riwayat keluarga pendek, pertumbuhan sejajar kurva di bawah P3, dan laboratorium normal tanpa kelainan endokrin."},
{t:"C1-C2",s:"Constitutional delay of growth and puberty (CDGP) ditandai oleh...",o:["Usia tulang lebih muda dari usia kronologis, tinggi dewasa di atas P3, dan riwayat keluarga yang sering positif","Usia tulang sesuai kronologis dengan tinggi dewasa di bawah P3","Usia tulang lebih tua dari kronologis dengan percepatan pertumbuhan pada masa kanak-kanak","Tinggi dewasa di bawah P3 dengan kelainan endokrin yang jelas","Pertumbuhan normal sejak lahir tanpa perlambatan"],w:["Usia tulang sesuai kronologis dengan tinggi dewasa di bawah P3 adalah ciri familial short stature, bukan CDGP.","Usia tulang lebih tua dengan percepatan pertumbuhan pada masa kanak-kanak tidak sesuai dengan pola CDGP.","CDGP tidak disertai kelainan endokrin; adanya kelainan endokrin mengarah ke penyebab lain.","CDGP ditandai perlambatan linier pada tiga tahun pertama kehidupan, sehingga pertumbuhan normal sejak lahir tidak sesuai."],e:"CDGP ditandai usia tulang lebih muda dari kronologis, tinggi dewasa di atas P3 dan sesuai TPG, serta riwayat keluarga positif pada sekitar 60-90% kasus. Pertumbuhan linier melambat pada tiga tahun pertama, lalu sejajar kurva normal saat prepubertas, dan mengalami percepatan saat pubertas."},
{t:"C1-C2",s:"Constitutional delay of growth and puberty lebih sering terjadi pada...",o:["Anak laki-laki","Anak perempuan","Bayi prematur saja","Anak dengan hipotiroid","Sama pada laki-laki dan perempuan"],w:["Anak perempuan tidak lebih sering mengalami CDGP menurut pedoman.","Bayi prematur tidak termasuk kelompok yang khas untuk CDGP.","Anak dengan hipotiroid memiliki kelainan endokrin, sedangkan CDGP tidak disertai kelainan endokrin.","Pedoman menyebutkan CDGP lebih banyak pada anak laki-laki, sehingga pilihan sama tidak tepat."],e:"CDGP lebih sering terjadi pada anak laki-laki. Keterlambatan pertumbuhan dan pubertas sering diturunkan, dan dapat ditemukan riwayat keterlambatan menstruasi pada ibu atau keterlambatan pubertal spurt pada ayah."},
{t:"C1-C2",s:"Weight faltering atau failure to thrive didefinisikan sebagai...",o:["Kenaikan berat badan yang tidak adekuat","Penurunan berat badan yang drastis dalam satu hari","Tinggi badan di bawah P3 sejak lahir","Lingkar kepala di bawah P3","Pertumbuhan tinggi badan yang lebih cepat dari normal"],w:["Penurunan berat badan drastis dalam satu hari adalah kondisi akut dan berbeda dari weight faltering.","Tinggi badan di bawah P3 sejak lahir adalah perawakan pendek, bukan definisi weight faltering.","Lingkar kepala di bawah P3 adalah masalah ukuran kepala, tidak sesuai definisi.","Pertumbuhan tinggi yang lebih cepat dari normal bukan weight faltering."],e:"Weight faltering atau failure to thrive didefinisikan sebagai kenaikan berat badan yang tidak adekuat. Kondisi ini dapat dideteksi dini pada KMS di buku KIA sebagai berat badan yang tidak naik atau tidak mengikuti garis pertumbuhan."},
{t:"C1-C2",s:"Penyebab stunting diawali oleh urutan kejadian berikut...",o:["Weight faltering yang tidak ditatalaksana optimal, lalu perlambatan laju pertumbuhan linier, lalu stunting","Stunting langsung terjadi tanpa tahapan sebelumnya","Infeksi berat, lalu obesitas, lalu stunting","Hipotiroid, lalu perlambatan usia tulang, lalu stunting","Kelebihan gizi, lalu weight faltering, lalu stunting"],w:["Stunting tidak terjadi langsung; ada tahap awal weight faltering yang tidak ditangani.","Infeksi berat lalu obesitas bukan urutan penyebab stunting menurut pedoman.","Hipotiroid adalah penyebab endokrin perawakan pendek, bukan urutan umum stunting.","Kelebihan gizi tidak menyebabkan stunting; stunting berhubungan dengan kekurangan gizi kronis."],e:"Stunting diawali kenaikan berat badan yang tidak adekuat yang tidak ditatalaksana secara optimal. Tubuh kemudian berusaha mempertahankan status gizi, sehingga laju pertumbuhan linier melambat dan terjadi stunting sebagai malnutrisi kronik."},
{t:"C1-C2",s:"Empat faktor penyebab langsung stunting menurut PPT adalah...",o:["Keluarga dan rumah tangga, ASI, makanan pendamping ASI (MPASI), dan infeksi","Genetik, usia ibu, kebijakan nasional, dan geografis","Pendidikan ayah, pekerjaan ibu, pendapatan, dan akses air","Hipotiroid, defisiensi GH, IEM, dan penyakit jantung bawaan","Imunisasi, pengukuran antropometri, usia pubertas, dan stres"],w:["Genetik, usia ibu, kebijakan nasional, dan geografis adalah faktor tidak langsung atau predisposisi, bukan empat faktor langsung.","Pendidikan ayah, pekerjaan ibu, pendapatan, dan akses air adalah faktor sosial dan lingkungan, bukan faktor langsung.","Hipotiroid, defisiensi GH, IEM, dan penyakit jantung bawaan adalah penyebab endokrin atau organik, bukan faktor langsung stunting.","Imunisasi dan antropometri adalah bagian dari pencegahan dan pemeriksaan, bukan faktor penyebab langsung."],e:"PPT menyebutkan empat faktor langsung stunting, yaitu keluarga dan rumah tangga, ASI, MPASI, dan infeksi. Faktor ini bekerja bersama dan berinteraksi, sehingga intervensi perlu mencakup seluruhnya."},
{t:"C1-C2",s:"Prevalensi stunting balita nasional berdasarkan SSGI 2024 adalah...",o:["19,8 persen","10,2 persen","27,7 persen","5,1 persen","33,5 persen"],w:["10,2 persen terlalu rendah dan tidak sesuai dengan data SSGI 2024 yang dirujuk PPT.","27,7 persen terlalu tinggi dan tidak sesuai dengan angka nasional SSGI 2024.","5,1 persen jauh di bawah angka nasional dan tidak sesuai data PPT.","33,5 persen jauh di atas angka nasional dan tidak sesuai dengan data SSGI 2024."],e:"Berdasarkan SSGI 2024, prevalensi stunting nasional adalah 19,8 persen, setara sekitar 4,48 juta balita, dan turun 1,7 persen dibanding 2023. Indonesia menduduki peringkat kedua tertinggi di Asia Tenggara."},
{t:"C1-C2",s:"Frekuensi pengukuran antropometri yang dianjurkan pada anak usia 12 bulan sampai 3 tahun adalah...",o:["Setiap 3 bulan","Setiap 1 bulan","Setiap 6 bulan","Setiap 12 bulan","Setiap minggu"],w:["Setiap 1 bulan adalah frekuensi untuk usia 0-12 bulan, bukan 12 bulan sampai 3 tahun.","Setiap 6 bulan adalah frekuensi untuk usia 3-6 tahun.","Setiap 12 bulan adalah frekuensi untuk usia 6-18 tahun.","Setiap minggu terlalu sering dan tidak sesuai dengan pedoman pengukuran rutin."],e:"Pengukuran antropometri dilakukan secara berkala dan kontinyu: usia 0-12 bulan setiap 1 bulan, usia 12 bulan sampai 3 tahun setiap 3 bulan, usia 3-6 tahun setiap 6 bulan, dan usia 6-18 tahun setiap 1 tahun."},
{t:"C1-C2",s:"PMT penyuluhan dalam program stunting diberikan kepada balita usia 6-59 bulan dengan frekuensi...",o:["Satu kali sebulan pada hari buka posyandu, diselenggarakan oleh kader posyandu","Setiap hari, diselenggarakan oleh puskesmas","Satu kali seminggu di rumah sakit","Setiap tiga bulan oleh dokter spesialis","Satu kali seumur hidup"],w:["Setiap hari dan diselenggarakan puskesmas adalah ciri PMT pemulihan, bukan PMT penyuluhan.","Satu kali seminggu di rumah sakit tidak sesuai dengan penyelenggaraan PMT penyuluhan di posyandu.","Setiap tiga bulan oleh dokter spesialis tidak sesuai dengan peran kader dan frekuensi PMT penyuluhan.","Pemberian sekali seumur hidup tidak sesuai dengan tujuan edukasi berkelanjutan."],e:"PMT penyuluhan bertujuan sebagai sarana edukasi pemberian makanan, dengan sasaran balita 6-59 bulan, frekuensi satu kali sebulan pada hari buka posyandu, dan penyelenggaraan oleh kader posyandu. PMT berbahan pangan lokal digunakan sebagai contoh gizi seimbang."},
{t:"C3-C4",s:"Anak laki-laki 7 tahun dengan TB 105 cm (di bawah P3). Usia tulang 5 tahun, kecepatan tumbuh sempat melambat pada tiga tahun pertama namun kini sejajar kurva, dan ayahnya juga mengalami keterlambatan pubertas dan pendek. Pemeriksaan laboratorium normal. Diagnosis yang paling mungkin adalah...",o:["Constitutional delay of growth and puberty (CDGP)","Familial short stature","Hipotiroid primer","Defisiensi hormon pertumbuhan","Stunting akibat malnutrisi kronis"],w:["Familial short stature memiliki usia tulang sesuai kronologis, sedangkan pada kasus ini usia tulang lebih muda.","Hipotiroid primer memiliki laboratorium abnormal dan tidak sesuai dengan laboratorium normal pada kasus ini.","Defisiensi hormon pertumbuhan memiliki kecepatan tumbuh yang persisten rendah dan biasanya tidak sejajar kurva normal.","Stunting akibat malnutrisi kronis tidak sesuai dengan riwayat keluarga pendek dan pola pertumbuhan yang berulang sejajar kurva pada kasus ini."],e:"Gambaran usia tulang lebih muda, perlambatan linier pada tiga tahun pertama yang kemudian sejajar kurva, riwayat keluarga dengan keterlambatan pubertas dan pendek, serta laboratorium normal mengarah ke CDGP. Pada CDGP, tinggi dewasa biasanya dalam batas normal setelah catch-up saat pubertas."},
{t:"C3-C4",s:"Anak perempuan 9 tahun dengan TB di bawah P3 yang konsisten sejak usia 3 tahun. Tinggi midparental sekitar 150 cm. Usia tulang sesuai usia kronologis, kecepatan tumbuh normal, dan laboratorium normal. Diagnosis dan pemantauan yang tepat adalah...",o:["Familial short stature; pemantauan kurva pertumbuhan dan tidak diperlukan terapi jika variasi normal","Hipotiroid; langsung levotiroksin","Defisiensi GH; langsung terapi hormon pertumbuhan","Stunting; langsung PMT pemulihan setiap hari","Kelainan kromosom; langsung kariotipe sebagai satu-satunya langkah"],w:["Hipotiroid memerlukan laboratorium abnormal, sedangkan pada kasus ini laboratorium normal.","Defisiensi GH memerlukan kecepatan tumbuh rendah dan usia tulang terlambat, yang tidak ditemukan pada kasus ini.","Stunting pada kasus ini tidak sesuai dengan pola tinggi badan konsisten yang sejajar dengan kurva dan riwayat keluarga pendek.","Kariotipe tidak menjadi langkah pertama pada kasus ini karena tidak ada tanda sindrom atau kelainan kromosom."],e:"Pola tinggi badan konsisten di bawah P3 dengan kecepatan tumbuh normal, usia tulang sesuai kronologis, tinggi midparental pendek, dan laboratorium normal sesuai familial short stature. Anak dipantau berkala dan perawakan pendek variasi normal tidak memerlukan terapi."},
{t:"C3-C4",s:"Balita 18 bulan dengan TB di bawah -2 SD dan kecepatan tumbuh rendah. Riwayat ASI eksklusif berhenti pada usia 4 bulan, MPASI rendah energi, dan diare berulang. Mekanisme yang paling tepat menjelaskan kondisi ini adalah...",o:["Weight faltering akibat asupan dan infeksi yang tidak ditatalaksana, lalu perlambatan pertumbuhan linier dan stunting","Defisiensi hormon tiroid primer yang menyebabkan perlambatan pertumbuhan","Kelainan genetik yang menyebabkan tinggi akhir pendek sejak lahir","Peningkatan kebutuhan energi karena pubertas dini","Pertumbuhan normal tanpa gangguan karena anak masih kecil"],w:["Hipotiroid primer tidak menjelaskan riwayat asupan dan diare berulang pada kasus ini; laboratorium perlu dicek, namun mekanisme utama adalah gizi.","Kelainan genetik tidak sesuai dengan riwayat asupan yang berubah dan diare berulang sebagai pemicu.","Pubertas dini tidak sesuai dengan usia 18 bulan dan tidak menjelaskan kondisi ini.","Pertumbuhan normal tidak sesuai dengan TB di bawah -2 SD dan kecepatan tumbuh rendah."],e:"Pada kasus ini, asupan yang tidak adekuat dan infeksi berulang memicu weight faltering. Jika tidak ditangani, laju pertumbuhan linier melambat dan terjadi stunting sebagai malnutrisi kronik. Pemeriksaan lanjutan tetap diperlukan untuk menyingkirkan penyebab lain."},
{t:"C3-C4",s:"Balita 4 tahun dengan TB dan BB sesuai dengan kurva usia, namun usia tinggi (usia median TB anak saat ini) setara dengan 3 tahun. Cara menentukan stunting pada kasus ini adalah...",o:["Usia tinggi lebih rendah dari usia kronologis, sehingga memenuhi kriteria stunting","Usia tinggi lebih tinggi dari usia kronologis, sehingga normal","BB sesuai usia menyingkirkan stunting sepenuhnya","Stunting ditentukan hanya oleh lingkar kepala","Stunting tidak dapat ditentukan tanpa pemeriksaan usia tulang"],w:["Usia tinggi lebih tinggi dari kronologis berarti pertumbuhan linier baik, bertentangan dengan data kasus ini.","BB sesuai usia tidak menyingkirkan stunting, karena stunting dinilai dari pertumbuhan linier (PB/U atau TB/U).","Lingkar kepala tidak menentukan stunting; stunting dinilai dari PB/U atau TB/U.","Stunting dapat ditentukan dengan usia tinggi dan indikator PB/U atau TB/U tanpa perlu usia tulang."],e:"Cara menentukan stunting dengan usia tinggi membandingkan usia median TB anak dengan usia kronologisnya. Pada kasus ini, usia tinggi 3 tahun lebih rendah dari usia kronologis 4 tahun, sehingga memenuhi kriteria stunting. Penilaian ini dilengkapi indikator PB/U atau TB/U."},
{t:"C3-C4",s:"Pada anak dengan stunting, skrining laboratorium dan penunjang yang sesuai indikasi meliputi...",o:["TSH untuk skrining hipotiroid kongenital, skrining TB, dan skrining HIV sesuai indikasi","Kadar GH saja tanpa pemeriksaan lain","CT scan kepala pada semua anak","Kadar kortisol serum rutin pada semua anak","Biopsi usus sebagai pemeriksaan pertama"],w:["Kadar GH saja tidak mencakup skrining yang dianjurkan, seperti hipotiroid, TB, dan HIV.","CT scan kepala tidak dilakukan rutin; pemeriksaan pencitraan dipilih sesuai indikasi klinis.","Kadar kortisol rutin tidak dianjurkan pada semua anak; pemeriksaan sesuai dugaan klinis.","Biopsi usus tidak menjadi pemeriksaan pertama pada stunting; pemeriksaan bersifat invasif dan sesuai indikasi khusus."],e:"Pemeriksaan laboratorium dan penunjang pada stunting meliputi skrining hipotiroid kongenital dengan TSH, skrining TB dengan TCM dan skoring TB, skrining HIV, eksplorasi alergi susu sapi, eksplorasi inborn error of metabolism, dan bone age, sesuai indikasi."},
{t:"C3-C4",s:"Balita 2 tahun dengan berat badan tidak naik selama 14 hari. Pemberian makanan tambahan yang tepat adalah...",o:["PMT pemulihan setiap hari, diselenggarakan puskesmas, dengan evaluasi berat badan berkala","PMT penyuluhan satu kali sebulan oleh kader posyandu saja","Tidak perlu PMT karena belum gizi kurang","PMT hanya setelah berat badan naik","Pemberian suplemen vitamin saja tanpa makanan tambahan"],w:["PMT penyuluhan hanya sarana edukasi dan tidak cukup untuk memulihkan status gizi balita dengan berat badan tidak naik.","Tidak perlu PMT tidak sesuai, karena balita dengan berat badan tidak naik termasuk sasaran PMT pemulihan.","PMT setelah berat badan naik bertentangan dengan tujuan PMT pemulihan, yaitu memperbaiki status gizi.","Suplemen vitamin saja tidak memenuhi kebutuhan energi dan protein yang menjadi tujuan PMT pemulihan."],e:"PMT pemulihan bertujuan memperbaiki status gizi balita, diberikan setiap hari, dengan sasaran balita yang berat badannya tidak naik, berat badan kurang, atau gizi kurang. Penyelenggaranya adalah puskesmas, pemerintah daerah, dan mitra, dengan durasi disesuaikan kondisi balita."},
{t:"C3-C4",s:"Panganan olahan untuk diet khusus (PDK) diberikan kepada...",o:["Balita weight faltering yang ditatalaksana di puskesmas dengan evaluasi red flags","Semua balita sehat sebagai makanan rutin","Bayi di bawah 6 bulan sebagai pengganti ASI eksklusif","Anak remaja dengan obesitas","Dewasa dengan malnutrisi"],w:["Semua balita sehat tidak termasuk sasaran PDK; PDK diberikan pada balita dengan masalah pertumbuhan.","Bayi di bawah 6 bulan sebagai pengganti ASI eksklusif tidak sesuai, karena ASI eksklusif dianjurkan dan PDK bukan pengganti ASI.","Anak remaja dengan obesitas tidak termasuk sasaran PDK yang dirujuk PPT.","Dewasa dengan malnutrisi tidak termasuk sasaran PDK dalam pedoman balita dan anak."],e:"PDK diberikan pada balita yang mengalami weight faltering dan ditatalaksana di puskesmas agar tanda bahaya dapat dievaluasi. PDK untuk bayi dan anak meliputi formula bayi 0-6 bulan, formula lanjutan 6-12 bulan, formula pertumbuhan 12-36 bulan, dan MPASI."},
{t:"C3-C4",s:"Pangan olahan untuk keperluan medis khusus (PKMK) untuk anak diformulasikan untuk...",o:["Pengaturan pola makan pada gangguan tertentu, misalnya dukungan gizi pada anak berisiko gagal tumbuh, gizi kurang, atau gizi buruk, dan dapat sebagai pengganti atau tambahan","Makanan keluarga sehari-hari untuk anak sehat","Suplemen vitamin tunggal tanpa kandungan energi","ASI donor untuk bayi dengan intoleransi laktosa","Obat untuk menurunkan demam pada anak"],w:["Makanan keluarga sehari-hari tidak diformulasikan khusus untuk penyakit atau gangguan tertentu.","Suplemen vitamin tunggal tidak mengandung energi dan protein yang diperlukan untuk pemulihan gizi.","ASI donor bukan produk PKMK; pengelolaan intoleransi laktosa berbeda dari pengaturan PKMK.","Obat penurun demam bukan pangan olahan dan tidak termasuk PKMK."],e:"PKMK adalah makanan olahan yang diformulasikan khusus untuk pengaturan pola makan pada penyakit atau gangguan tertentu. Untuk bayi dan anak, PKMK meliputi dukungan gizi bagi anak berisiko gagal tumbuh kembang, gizi kurang, atau gizi buruk. PKMK dapat digunakan sebagai makanan pengganti maupun makanan tambahan."},
{t:"C3-C4",s:"Intervensi yang paling tepat untuk mencegah stunting menurut konsep 1.000 hari pertama kehidupan adalah...",o:["Memperbaiki asupan dan status gizi calon ibu, praktik pemberian makan yang benar, dan deteksi dini weight faltering","Pemberian hormon pertumbuhan sejak bayi tanpa indikasi","Pembatasan makan pada anak dengan TB rendah","Pemberian antibiotik profilaksis rutin sejak lahir","Pemberian kalsium tinggi pada ibu hamil tanpa evaluasi gizi"],w:["Pemberian hormon pertumbuhan tanpa indikasi tidak dianjurkan dan tidak termasuk pencegahan stunting.","Pembatasan makan pada anak pendek justru memperburuk malnutrisi dan bertentangan dengan pencegahan.","Antibiotik profilaksis rutin tidak termasuk pencegahan stunting dan dapat menimbulkan resistensi.","Kalsium tinggi tanpa evaluasi gizi bukan intervensi yang dirujuk; pencegahan dilakukan melalui perbaikan asupan dan status gizi."],e:"Pencegahan stunting dilakukan pada 1.000 hari pertama kehidupan, dimulai dari memperbaiki asupan dan status gizi calon ibu, memberikan praktik pemberian makan yang benar seperti ASI dan MPASI, serta mendeteksi dini weight faltering dan growth deceleration."},
{t:"C3-C4",s:"Pada anak stunting yang mengalami kenaikan pertumbuhan linier setelah usia 2 tahun (catch-up), dampak jangka panjang yang masih belum jelas perbaikannya adalah...",o:["Perbaikan kognitif dan sistem imun","Pertumbuhan tinggi badan","Berat badan sesuai usia","Usia tulang","Kadar hemoglobin"],w:["Pertumbuhan tinggi badan dapat mengalami catch-up pada periode ini, sehingga bukan aspek yang belum jelas perbaikannya.","Berat badan sesuai usia dapat membaik dengan intervensi, sehingga bukan aspek yang belum jelas.","Usia tulang dapat menyesuaikan dengan pertumbuhan dan bukan aspek yang belum jelas pada PPT.","Kadar hemoglobin tidak disebutkan sebagai aspek yang belum jelas perbaikannya dalam PPT."],e:"Menurut skema stunting syndrome, pada periode usia 2 tahun sampai pertengahan masa kanak-kanak dan pubertas, catch-up pertumbuhan linier dapat terjadi, tetapi perbaikan kognitif dan sistem imun belum jelas. Karena itu pencegahan pada 1.000 hari pertama tetap menjadi prioritas utama."},
{t:"C3-C4",s:"Dampak jangka panjang stunting yang bersifat irreversible meliputi...",o:["Gangguan perkembangan otak jangka panjang yang memengaruhi kognitif, prestasi sekolah, dan kapasitas kerja, serta peningkatan mortalitas dan infeksi","Perbaikan kognitif setelah usia 2 tahun dengan catch-up penuh","Penurunan risiko penyakit infeksi","Peningkatan kapasitas kerja tanpa gangguan","Tidak ada dampak jika pertumbuhan tinggi badan membaik"],w:["Perbaikan kognitif penuh setelah usia 2 tahun tidak sesuai dengan pernyataan PPT yang menyebut perbaikan kognitif belum jelas.","Penurunan risiko penyakit infeksi bertentangan dengan dampak stunting, yaitu peningkatan mortalitas dan infeksi.","Peningkatan kapasitas kerja tanpa gangguan tidak sesuai dengan dampak jangka panjang stunting.","Perbaikan tinggi badan tidak menghapus dampak irreversible pada perkembangan otak dan kognitif."],e:"Dampak stunting bersifat irreversible dan mencakup gangguan perkembangan otak jangka panjang yang memengaruhi kemampuan kognitif, prestasi sekolah, daya tahan tubuh, dan kapasitas kerja. Stunting juga meningkatkan mortalitas akibat penyakit infeksi seperti diare, ISPA, dan campak."},
{t:"C3-C4",s:"Faktor ibu yang berisiko menyebabkan stunting pada anak adalah...",o:["IMT rendah, kenaikan berat badan yang rendah selama kehamilan, pertumbuhan janin terhambat, dan kelahiran prematur","Usia ibu di atas 20 tahun dengan IMT normal","Pemberian ASI eksklusif selama enam bulan","Kehamilan dengan kenaikan berat badan yang adekuat","Imunisasi lengkap sebelum kehamilan"],w:["Usia ibu di atas 20 tahun dengan IMT normal tidak termasuk faktor risiko stunting menurut PPT.","Pemberian ASI eksklusif enam bulan merupakan faktor protektif, bukan risiko stunting.","Kenaikan berat badan yang adekuat selama kehamilan adalah faktor protektif, bukan faktor risiko.","Imunisasi lengkap merupakan faktor protektif terhadap infeksi, bukan faktor risiko stunting."],e:"Faktor ibu meliputi riwayat prakonsepsi, kehamilan dengan IMT dan kenaikan berat badan yang rendah, laktasi, riwayat pertumbuhan janin terhambat, dan kelahiran prematur. Faktor-faktor ini perlu dieksplorasi sejak anamnesis awal."},
{t:"C3-C4",s:"Deteksi dini weight faltering yang paling mudah dilakukan dalam pelayanan primer adalah dengan...",o:["Memantau berat badan secara berkala pada KMS di buku KIA dan melihat apakah mengikuti garis pertumbuhan","Mengukur lingkar kepala setiap minggu tanpa pencatatan","Memeriksa usia tulang sebagai skrining rutin","Memeriksa kadar GH pada semua balita","Menghitung rasio segmen atas dan bawah tubuh pada semua bayi"],w:["Lingkar kepala setiap minggu tanpa pencatatan tidak menilai pertumbuhan berat badan dan tidak sesuai dengan prinsip deteksi dini.","Pemeriksaan usia tulang bukan skrining rutin dan memerlukan indikasi tertentu.","Pemeriksaan GH pada semua balita tidak diindikasikan sebagai skrining rutin.","Rasio segmen atas dan bawah tidak digunakan sebagai skrining rutin pada semua bayi."],e:"Weight faltering dapat dideteksi dini melalui pemantauan berat badan berkala pada KMS dalam buku KIA, yaitu saat berat badan tidak naik atau tidak mengikuti garis pertumbuhan. Deteksi dini ini memungkinkan penanganan sebelum terjadi growth deceleration dan stunting."}
];
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const L="ABCDE";
let order=[],i=0,score=0,lv={};
function start(){
  order=sh(Q).map(q=>({q,o:sh(q.o.map((t,k)=>({t,c:k===0,r:k===0?"":q.w[k-1]})))}));
  i=0;score=0;lv={"C1-C2":[0,0],"C3-C4":[0,0]};show();
}
function show(){
  const app=document.getElementById('app');app.innerHTML='';
  if(i>=order.length){
    const c=$('div','card');
    c.append($('h3',null,'Hasil: '+score+' / '+order.length+' benar'));
    for(const k in lv)c.append($('p',null,k+': '+lv[k][0]+' / '+lv[k][1]+' benar'));
    const b=$('button','btn','Acak & Mulai Ulang');b.onclick=start;c.append(b);
    app.append(c);return;
  }
  const it=order[i];
  const pb=$('div','bar');const d=$('div');d.style.width=(i/order.length*100)+'%';pb.append(d);app.append(pb);
  const card=$('div','card');
  card.append($('p','tag','Soal '+(i+1)+' / '+order.length+'  ·  '+it.q.t));
  card.append($('p','stem',it.q.s));
  const btns=it.o.map((o,k)=>{
    const b=$('button','opt',L[k]+'. '+o.t);
    b.onclick=()=>pick(b,o,k);card.append(b);return b;
  });
  function pick(b,o,k){
    if(btns[0].disabled)return;
    btns.forEach(x=>x.disabled=true);
    lv[it.q.t][1]++;
    if(o.c){score++;lv[it.q.t][0]++;b.classList.add('ok');}
    else{b.classList.add('bad');btns[it.o.findIndex(x=>x.c)].classList.add('ok');}
    const ex=$('div','exp');
    const ci=it.o.findIndex(x=>x.c);
    ex.append($('p',null,'Jawaban benar: '+L[ci]+'. '+it.o[ci].t));
    ex.append($('p',null,it.q.e));
    ex.append($('h4',null,'Mengapa opsi lain tidak tepat:'));
    const ul=$('ul');
    it.o.forEach((x,j)=>{if(!x.c)ul.append($('li',null,L[j]+'. '+x.t+' → '+x.r));});
    ex.append(ul);
    card.append(ex);
    const nb=$('button','btn',i+1<order.length?'Soal Berikutnya':'Lihat Hasil');
    nb.onclick=()=>{i++;show();};card.append(nb);
  }
  app.append(card);
}
start();
</script>
